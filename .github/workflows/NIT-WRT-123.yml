name: NIT-WRT

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: '选择OpenWrt分支'
        required: true
        default: 'openwrt-23.05'
        type: choice
        options:
          - openwrt-24.10
          - openwrt-23.05
      target:
        description: '选择设备架构'
        required: true
        default: 'x86-64'
        type: choice
        options:
          - x86-64
          - r3g
      enable_ssh:
        description: '是否启用SSH调试'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检查代码
      uses: actions/checkout@v3

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: 安装依赖项
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行测试
      run: |
        python -m unittest discover
          
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "------------------------------- 更新并安装依赖 -------------------------------"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/${{ matrix.os }})
        wget https://bootstrap.pypa.io/pip/3.6/get-pip.py
        sudo python3 get-pip.py
        sudo rm -rf get-pip.py
        sudo pip install pyelftools
        echo "------------------------------- 清理Docker镜像和软件 -------------------------------"
        docker rmi `docker images -q`
        docker image prune -a -f
        sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        echo "------------------------------- 设置工作目录及时区 -------------------------------"
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: 克隆 OpenWrt 源码
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        git fetch origin ${{ github.event.inputs.branch }}
        git checkout ${{ github.event.inputs.branch }}

    - name: 应用自定义脚本 Part 1
      run: |
        chmod +x ../diy-part1.sh
        ../diy-part1.sh

    - name: 更新和安装 feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 应用自定义脚本 Part 2
      run: |
        chmod +x ../diy-part2.sh
        ../diy-part2.sh

    - name: 配置目标固件
      working-directory: openwrt
      run: |
        cp ../configs/${{ github.event.inputs.target }}/.config .config
        cp ../configs/${{ github.event.inputs.target }}/feeds.conf.default feeds.conf.default

    - name: 编译固件
      working-directory: openwrt
      run: |
        make defconfig
        make -j$(nproc) download
        make -j$(nproc) V=s

    - name: 上传固件
      uses: actions/upload-artifact@main
      with:
        name: openwrt-${{ github.event.inputs.target }}-${{ github.event.inputs.branch }}
        path: openwrt/bin/targets/
