name: NIT-WRT

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: '选择OpenWrt分支'
        required: true
        default: 'openwrt-23.05'
        type: choice
        options:
          - openwrt-24.10
          - openwrt-23.05
      target:
        description: '选择设备架构'
        required: true
        default: 'x86-64'
        type: choice
        options:
          - x86-64
          - r3g
      enable_ssh:
        description: '是否启用SSH调试'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检查代码
      uses: actions/checkout@v3

    - name: 设置编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-distutils

    - name: 克隆 OpenWrt 源码
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        git fetch origin ${{ github.event.inputs.branch }}
        git checkout ${{ github.event.inputs.branch }}

    - name: 应用自定义脚本 Part 1
      run: |
        chmod +x ../diy-part1.sh
        ../diy-part1.sh

    - name: 更新和安装 feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 应用自定义脚本 Part 2
      run: |
        chmod +x ../diy-part2.sh
        ../diy-part2.sh

    - name: 配置目标固件
      working-directory: openwrt
      run: |
        cp ../configs/${{ github.event.inputs.target }}/.config .config
        cp ../configs/${{ github.event.inputs.target }}/feeds.conf.default feeds.conf.default

    - name: 编译固件
      working-directory: openwrt
      run: |
        make defconfig
        make -j$(nproc) download
        make -j$(nproc) V=s

    - name: 上传固件
      uses: actions/upload-artifact@v3.1.0
      with:
        name: openwrt-${{ github.event.inputs.target }}-${{ github.event.inputs.branch }}
        path: openwrt/bin/targets/
